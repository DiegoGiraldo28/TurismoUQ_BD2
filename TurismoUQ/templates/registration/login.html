{% extends "base.html" %}
{% block title %}Ingresar · TurismoUQ{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Ingresar a TurismoUQ</h1>
    {% if form.errors %}<div class="alert alert-danger">El usuario o la contraseña no son correctos.</div>{% endif %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-success w-100">Ingresar</button></form>
  </div></div>
</div></div>
{% endblock %}
